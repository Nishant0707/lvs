name: lvs-live

services:
  backend:
    build: .
    init: true
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: "4000"

      # MongoDB connection comes from .env.
      # Redis runs inside this Docker Compose network.
      REDIS_URL: redis://redis:6379

    ports:
      - "127.0.0.1:4000:4000"

    depends_on:
      redis:
        condition: service_healthy

    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    logging: *logging

volumes:
  redis-data: